<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liên Quân Account Checker</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#17052b,#3b1468);
    color:white;
}
.card{
    width:min(420px,92%);
    padding:28px;
    border-radius:18px;
    background:#ffffff12;
    border:1px solid #ffffff20;
    box-shadow:0 15px 40px #0008;
}
h1{text-align:center;margin-top:0}
input{
    width:100%;
    padding:14px;
    margin:12px 0;
    border:0;
    border-radius:10px;
    outline:none;
    font-size:16px;
}
button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#8b5cf6;
    color:white;
    font-size:16px;
    cursor:pointer;
}
button:hover{background:#7c3aed}
.result{
    display:none;
    margin-top:20px;
    padding:18px;
    border-radius:12px;
    background:#0004;
}
.row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid #ffffff15;
}
</style>
</head>

<body>

<div class="card">
    <h1>Liên Quân Checker</h1>

    <input id="uid" type="text" placeholder="Nhập UID">

    <button onclick="checkAccount()">KIỂM TRA</button>

    <div id="result" class="result">
        <div class="row">
            <span>UID</span>
            <strong id="rUid">-</strong>
        </div>

        <div class="row">
            <span>Tên</span>
            <strong id="rName">-</strong>
        </div>

        <div class="row">
            <span>Rank</span>
            <strong id="rRank">-</strong>
        </div>
    </div>
</div>

<script>
async function checkAccount(){

    const uid = document.getElementById("uid").value.trim();

    if(!uid){
        alert("Vui lòng nhập UID");
        return;
    }

    /*
      Thay URL bên dưới bằng API mà bạn được phép sử dụng.

      Ví dụ API trả về:
      {
        "uid": "123456789",
        "name": "Player",
        "rank": "Cao Thủ"
      }
    */

    const API_URL = "/api/account?uid=" + encodeURIComponent(uid);

    try{
        const response = await fetch(API_URL);

        if(!response.ok){
            throw new Error("Không lấy được dữ liệu");
        }

        const data = await response.json();

        document.getElementById("rUid").textContent = data.uid || uid;
        document.getElementById("rName").textContent = data.name || "Không có dữ liệu";
        document.getElementById("rRank").textContent = data.rank || "Không có dữ liệu";

        document.getElementById("result").style.display = "block";

    }catch(error){
        alert("API chưa được kết nối hoặc UID không có dữ liệu.");
        console.error(error);
    }
}
</script>

</body>
</html>
